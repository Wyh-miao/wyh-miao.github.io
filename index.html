<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d1c">
<meta name="format-detection" content="telephone=no">
<title>给你</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #fff;
    background: #0a0d1c;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(ellipse 130% 85% at 50% 34%, #2c2247 0%, #18203c 46%, #0a0d1c 100%);
  }
  .glow {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 130vw;
    height: 130vw;
    transform: translate3d(-50%, -50%, 0);
    background: radial-gradient(circle, rgba(255, 145, 180, .17) 0%, rgba(255, 145, 180, 0) 62%);
    opacity: .85;
    animation: breathe 7s ease-in-out infinite;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  body.light-on .glow {
    opacity: 1;
    background: radial-gradient(circle, rgba(255, 205, 175, .34) 0%, rgba(255, 170, 190, 0) 68%);
  }
  @keyframes breathe {
    0%, 100% { transform: translate3d(-50%, -50%, 0) scale(1); }
    50%      { transform: translate3d(-50%, -50%, 0) scale(1.13); }
  }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #ffdce6;
    box-shadow: 0 0 6px rgba(255, 190, 215, .75);
    opacity: 0;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { transform: translate3d(0, 24px, 0); opacity: 0; }
    20%  { opacity: .55; }
    80%  { opacity: .32; }
    100% { transform: translate3d(10px, -80px, 0); opacity: 0; }
  }
  .brand {
    position: absolute;
    top: calc(24px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    z-index: 3;
    color: rgba(255, 255, 255, .42);
    pointer-events: none;
  }
  .brand svg {
    width: 14px;
    height: 14px;
    fill: #ff8fae;
    opacity: .8;
    vertical-align: -2px;
    margin-right: 7px;
    animation: beat 2.6s ease-in-out infinite;
  }
  .brand span { font-size: 12px; letter-spacing: .24em; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.18); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.12); }
  }
  .lyrics {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 2;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 74%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 74%, transparent 100%);
  }
  .lyrics-inner {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding-left: 26px;
    padding-right: 26px;
    transition: transform .85s cubic-bezier(.22, .61, .36, 1);
    will-change: transform;
  }
  .line {
    min-height: 66px;
    padding: 8px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(19px, 5vw, 27px);
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: .02em;
    color: rgba(226, 220, 240, .55);
    opacity: .08;
    transform: scale(.9);
    transition: opacity .7s ease, transform .7s ease, color .7s ease, text-shadow .7s ease;
    cursor: pointer;
  }
  .txt { min-width: 0; max-width: 100%; }
  .line.far  { opacity: .07;  transform: scale(.88); }
  .line.mid  { opacity: .2;   transform: scale(.92); }
  .line.near { opacity: .42;  transform: scale(.96); }
  .line.active {
    opacity: 1;
    transform: scale(1.06);
    color: #fff2f5;
    font-weight: 500;
    text-shadow: 0 0 28px rgba(255, 155, 190, .55);
  }
  body.light-on .line.active {
    color: #fff6ec;
    text-shadow: 0 0 34px rgba(255, 205, 165, .7);
  }
  .player {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3;
    padding: 0 26px calc(16px + env(safe-area-inset-bottom));
  }
  .progress { display: flex; align-items: center; gap: 12px; }
  .time {
    width: 38px;
    flex: 0 0 38px;
    font-size: 11px;
    color: rgba(255, 255, 255, .4);
    font-variant-numeric: tabular-nums;
  }
  .time.total { text-align: right; }
  .bar-wrap {
    flex: 1;
    min-width: 0;
    height: 30px;
    display: flex;
    align-items: center;
    touch-action: none;
    cursor: pointer;
  }
  .bar {
    position: relative;
    width: 100%;
    height: 2px;
    border-radius: 2px;
    background: rgba(255, 255, 255, .16);
  }
  .fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: 2px;
    background: #ff8fae;
    box-shadow: 0 0 8px rgba(255, 143, 174, .6);
    transform: scaleX(0);
    transform-origin: left center;
  }
  .dot {
    position: absolute;
    top: 50%;
    left: 0;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255, 155, 190, .9);
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 46px;
    margin-top: 12px;
  }
  .btn {
    border: 0;
    padding: 0;
    background: none;
    color: rgba(255, 255, 255, .72);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn:active { opacity: .55; }
  .btn svg { width: 24px; height: 24px; fill: currentColor; display: block; }
  .btn-main {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #fff;
  }
  .btn-main svg { width: 25px; height: 25px; }
  .hint {
    margin-top: 16px;
    text-align: center;
    font-size: 11px;
    letter-spacing: .06em;
    color: rgba(255, 255, 255, .3);
  }
  @media (prefers-reduced-motion: reduce) {
    .glow, .star, .brand svg { animation: none; }
    .star { opacity: .3; }
    .lyrics-inner, .line { transition-duration: .01ms; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="stars" id="stars"></div>

  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 20.7l-1.1-1C5.1 14.5 2 11.7 2 8.4 2 5.8 4 3.8 6.6 3.8c1.5 0 3 .7 3.9 1.9.9-1.2 2.4-1.9 3.9-1.9C17 3.8 19 5.8 19 8.4c0 3.3-3.1 6.1-8.9 11.3l-1.1 1z"/></svg>
    <span>给你</span>
  </div>

  <div class="lyrics" id="lyrics">
    <div class="lyrics-inner" id="inner"></div>
  </div>

  <div class="player">
    <div class="progress">
      <span class="time" id="cur">00:00</span>
      <div class="bar-wrap" id="barWrap">
        <div class="bar">
          <div class="fill" id="fill"></div>
          <div class="dot" id="dot"></div>
        </div>
      </div>
      <span class="time total" id="total">00:00</span>
    </div>
    <div class="controls">
      <button class="btn" id="prev" aria-label="上一句">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5L9 12l11 7z"/></svg>
      </button>
      <button class="btn btn-main" id="play" aria-label="播放或暂停"></button>
      <button class="btn" id="next" aria-label="下一句">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
    </div>
    <div class="hint" id="hint">轻点歌词可以跳到那一句</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ICON_PAUSE  = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  var ICON_PLAY   = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var ICON_REPLAY = '<svg viewBox="0 0 24 24"><path d="M12 4V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg>';
  var HINT = "轻点歌词可以跳到那一句";

  // 原文逐行照搬，空字符串表示段落间的停顿（只走时间，不显示歌词）。
  // 想配歌的话，把下面的时长改成对应时间戳即可，其余逻辑不用动。
  var RAW = [
    ["", 1.4],
    ["诶诶诶", 2.8],
    ["你竟然扫描了这个二维码", 4.2],
    ["", 2.6],
    ["我猜", 2.8],
    ["你今天特别想听到那四个字", 4.4],
    ["可是我想说的", 3.4],
    ["不仅仅是“生日快乐”啊", 4.0],
    ["", 1.8],
    ["可是捏", 2.6],
    ["心脏到嘴仅仅30厘米", 4.2],
    ["我却开不了口呜呜", 3.6],
    ["", 1.8],
    ["所以", 2.6],
    // 这三句共用同一束暖光，直到后面的间奏结束才慢慢收回去。
    ["请把这张贺卡对准强光吧", 4.6, "light"],
    ["正面留白的地方", 4.0, "light"],
    ["就是我没说出的另外四个字（嘻嘻）", 4.8, "light"],
    ["", 1.8],
    ["卡面太小，", 3.2],
    ["身不由己……", 3.6],
    ["行间太密，", 3.2],
    ["心事难藏……", 4.4],
    ["", 3.6]
  ];

  // 全篇总时长；想再快或再慢只改这一个数，各行与停顿会等比缩放。
  // 配歌时把它设成歌曲长度，并把 RAW 里的时长改成对应的绝对秒数。
  var TARGET_SECONDS = 45;
  var rawTotal = 0;
  for (var r = 0; r < RAW.length; r++) rawTotal += RAW[r][1];
  var scale = TARGET_SECONDS / rawTotal;

  var lines = [];
  var cursor = 0;
  for (var i = 0; i < RAW.length; i++) {
    var text = RAW[i][0], dur = RAW[i][1] * scale;
    if (text) lines.push({ text: text, start: cursor, end: cursor + dur, tag: RAW[i][2] || "" });
    cursor += dur;
  }
  var total = TARGET_SECONDS;

  var stage    = document.getElementById("stage");
  var lyrics   = document.getElementById("lyrics");
  var inner    = document.getElementById("inner");
  var fill     = document.getElementById("fill");
  var dot      = document.getElementById("dot");
  var curEl    = document.getElementById("cur");
  var totalEl  = document.getElementById("total");
  var playBtn  = document.getElementById("play");
  var prevBtn  = document.getElementById("prev");
  var nextBtn  = document.getElementById("next");
  var barWrap  = document.getElementById("barWrap");
  var hintEl   = document.getElementById("hint");
  var stars    = document.getElementById("stars");

  var rowEls = [];
  for (var j = 0; j < lines.length; j++) {
    (function (line) {
      var el = document.createElement("div");
      el.className = "line";
      var span = document.createElement("span");
      span.className = "txt";
      span.textContent = line.text;
      el.appendChild(span);
      el.addEventListener("click", function () {
        elapsed = line.start + 0.02;
        isEnded = false;
        hintEl.textContent = HINT;
        updateButton();
        render(elapsed, true);
      });
      inner.appendChild(el);
      rowEls.push(el);
    })(lines[j]);
  }

  for (var k = 0; k < 16; k++) {
    var s = document.createElement("i");
    s.className = "star";
    var size = 1.5 + Math.random() * 2.5;
    s.style.left = (Math.random() * 100) + "%";
    s.style.top = (18 + Math.random() * 82) + "%";
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.animationDuration = (9 + Math.random() * 12) + "s";
    s.style.animationDelay = (-Math.random() * 20) + "s";
    stars.appendChild(s);
  }

  // 访问 index.html?t=20 可直接从指定秒数开始，方便预览任意一句。
  var startParam = parseFloat((window.location.search.match(/[?&]t=([\d.]+)/) || [])[1]);
  var elapsed = (!isNaN(startParam)) ? Math.max(0, Math.min(total, startParam)) : 0;
  // 调试用：index.html?w=390 可把舞台固定成指定宽度，在桌面预览窄屏效果。
  var widthParam = parseFloat((window.location.search.match(/[?&]w=(\d+)/) || [])[1]);
  if (widthParam > 0) stage.style.width = widthParam + "px";
  var playing = true;
  var isEnded = false;
  var dragging = false;
  var lastTs = 0;
  var lastIdx = -1;
  var lastRendered = -1;

  function fmt(t) {
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function indexAt(t) {
    var lo = 0, hi = lines.length - 1, ans = 0;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (lines[mid].start <= t) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function styleLines(idx) {
    for (var i = 0; i < rowEls.length; i++) {
      var d = Math.abs(i - idx);
      var el = rowEls[i];
      el.className = "line" + (d === 0 ? " active" : d === 1 ? " near" : d === 2 ? " mid" : " far");
    }
    document.body.classList.toggle("light-on", lines[idx].tag === "light");
  }

  function scrollTo(idx) {
    var el = rowEls[idx];
    var offset = el.offsetTop + el.offsetHeight / 2 - lyrics.clientHeight / 2 + 42;
    inner.style.transform = "translate3d(0," + (-offset) + "px,0)";
  }

  function render(t, force) {
    var idx = indexAt(t);
    if (force || idx !== lastIdx) {
      styleLines(idx);
      scrollTo(idx);
      lastIdx = idx;
    }
    var ratio = Math.max(0, Math.min(1, t / total));
    fill.style.transform = "scaleX(" + ratio + ")";
    dot.style.left = (ratio * 100) + "%";
    curEl.textContent = fmt(t);
  }

  function layout() {
    var half = lyrics.clientHeight / 2;
    inner.style.paddingTop = half + "px";
    inner.style.paddingBottom = half + "px";
    render(elapsed, true);
  }

  function updateButton() {
    playBtn.innerHTML = isEnded ? ICON_REPLAY : (playing ? ICON_PAUSE : ICON_PLAY);
  }

  function seek(x) {
    var rect = barWrap.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (x - rect.left) / rect.width));
    elapsed = ratio * total;
    isEnded = false;
    hintEl.textContent = HINT;
    updateButton();
    render(elapsed, true);
  }

  playBtn.addEventListener("click", function () {
    if (isEnded) {
      elapsed = 0;
      isEnded = false;
      playing = true;
      hintEl.textContent = HINT;
      updateButton();
      render(elapsed, true);
      return;
    }
    playing = !playing;
    updateButton();
  });

  prevBtn.addEventListener("click", function () {
    var idx = indexAt(elapsed);
    var target = (elapsed - lines[idx].start > 1.2) ? idx : Math.max(0, idx - 1);
    elapsed = lines[target].start + 0.02;
    isEnded = false;
    hintEl.textContent = HINT;
    updateButton();
    render(elapsed, true);
  });

  nextBtn.addEventListener("click", function () {
    var idx = Math.min(lines.length - 1, indexAt(elapsed) + 1);
    elapsed = lines[idx].start + 0.02;
    isEnded = false;
    hintEl.textContent = HINT;
    updateButton();
    render(elapsed, true);
  });

  barWrap.addEventListener("touchstart", function (e) {
    dragging = true;
    seek(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });
  barWrap.addEventListener("touchmove", function (e) {
    if (dragging) { seek(e.touches[0].clientX); e.preventDefault(); }
  }, { passive: false });
  barWrap.addEventListener("touchend", function () { dragging = false; }, { passive: true });
  barWrap.addEventListener("touchcancel", function () { dragging = false; }, { passive: true });
  barWrap.addEventListener("mousedown", function (e) { dragging = true; seek(e.clientX); });
  window.addEventListener("mousemove", function (e) { if (dragging) seek(e.clientX); });
  window.addEventListener("mouseup", function () { dragging = false; });

  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 220); });

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    // 切到后台再回来时 rAF 会暂停，限制单帧步长避免歌词一次跳好几行。
    var dt = Math.min((ts - lastTs) / 1000, 0.25);
    lastTs = ts;
    if (playing && !dragging) {
      elapsed += dt;
      if (elapsed >= total) {
        elapsed = total;
        playing = false;
        isEnded = true;
        hintEl.textContent = "再听一遍";
        updateButton();
      }
    }
    if (elapsed !== lastRendered) {
      render(elapsed);
      lastRendered = elapsed;
    }
    requestAnimationFrame(frame);
  }

  totalEl.textContent = fmt(total);
  updateButton();
  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
